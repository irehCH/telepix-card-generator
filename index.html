<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>텔레픽스 명함</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <a class="home" href="./" data-keep-query title="홈으로">⌂ 홈</a>
  <strong>TELEPIX 명함</strong><span class="sp"></span>
</header>
<main>
  <section class="hero">
    <h1>텔레픽스 명함</h1>
    <p class="sub">회사 이메일로 들어와 정보를 확인하면 인쇄용 명함 파일이 바로 만들어집니다.</p>
  </section>
  <nav class="choices" aria-label="메뉴">
    <a class="choice" href="apply/" data-keep-query>
      <span class="choice-photo"><img src="assets/home-apply.webp" alt="" onerror="this.parentNode.classList.add('empty')"></span>
      <span class="choice-title">명함 신청하기</span>
      <span class="choice-desc">내 정보로 명함을 만들고 신청 내역을 확인합니다.</span>
      <span class="choice-meta">기본형 최대 7일 · 긴급형 최대 3일 (업무시간 기준)</span>
    </a>
    <a class="choice" href="admin/" data-keep-query>
      <span class="choice-photo dark"><img src="assets/home-admin.webp" alt="" onerror="this.parentNode.classList.add('empty')"></span>
      <span class="choice-title">관리자</span>
      <span class="choice-desc">신청 확인·수정·삭제, 주문용 PDF 합치기</span>
      <span class="choice-meta">비밀번호 필요</span>
    </a>
  </nav>
</main>
<script src="js/nav.js"></script>
</body>
</html>
