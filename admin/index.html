<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<base href="../">
<title>명함 관리자</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
</head>
<body>
<div id="demoBanner" class="demo-banner hidden">데모 모드 — 서버에 연결되지 않았습니다 (이 브라우저에만 저장)</div>
<header>
  <a class="home" href="./" data-keep-query title="홈으로">⌂ 홈</a>
  <strong>TELEPIX 명함 관리자</strong><span class="sp"></span>
</header>
<main>
  <section id="vLogin" class="panel narrow hidden">
    <h2>관리자 로그인</h2>
    <form id="fPass">
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <div class="row" style="margin-top:12px"><button class="primary" id="btnLogin">들어가기</button></div>
    </form>
    <div id="loginMsg" class="msg info"></div>
  </section>

  <section id="vList" class="hidden">
    <div class="row" style="justify-content:space-between"><h1>명함 신청 목록</h1><button type="button" id="logout" class="link">로그아웃</button></div>
    <p class="sub">이름을 누르면 신청 내용을 보고 고칠 수 있습니다. <b>PDF 합치기</b>는 위의 타입·수령 장소 필터에 맞는 신청을 수령 장소·타입별 주문용 PDF로 합쳐 내려받습니다 (필터가 전체면 조합마다 한 파일씩). 신청은 14일이 지나면 자동으로 지워집니다.</p>
    <div class="panel">
      <div class="toolbar">
        <select id="typeFilter" style="width:auto" aria-label="타입">
          <option value="">타입 전체</option>
          <option value="basic">기본형</option>
          <option value="fast">긴급형</option>
        </select>
        <select id="pickupFilter" style="width:auto" aria-label="수령 장소">
          <option value="">수령 장소 전체</option>
          <option>서울캠퍼스</option>
          <option>대전캠퍼스</option>
        </select>
        <button id="refresh">새로고침</button>
        <span id="count" class="hint"></span>
        <span class="sp"></span>
        <select id="bleed" style="width:auto" aria-label="재단 여백" title="주문용 PDF의 재단 여백 (완성 크기 90×50mm 바깥)">
          <option value="1">재단 여백 1mm (92×52)</option>
          <option value="2">재단 여백 2mm (94×54)</option>
        </select>
        <button id="merge" class="accent">PDF 합치기</button>
        <button id="delAll" class="danger">전체 삭제</button>
      </div>
      <div id="listMsg" class="msg"></div>
      <div class="tablewrap">
        <table>
          <thead><tr><th>미리보기</th><th>신청자</th><th>타입</th><th>신청</th><th>수령</th><th>메모 / 경고</th><th>PDF</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </section>
  <section id="vLoading" class="panel narrow">불러오는 중…</section>
</main>

<!-- 신청 내용 보기·수정 -->
<div id="editModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="editTitle">
  <div class="panel">
    <div class="row" style="justify-content:space-between">
      <h2 id="editTitle" style="margin:0">신청 수정</h2>
      <button type="button" id="editClose" aria-label="닫기">닫기</button>
    </div>
    <p class="detail" id="editMeta"></p>
    <div class="layout">
      <form id="fEdit" autocomplete="off">
        <div id="editFields"></div>
        <label for="adminMemo">관리자 메모 <span class="opt">(선택 · 신청자에게 보임)</span></label>
        <textarea id="adminMemo" rows="2"></textarea>
        <div id="editWarn" class="msg warn"></div>
        <div class="row" style="margin-top:16px">
          <button class="accent" id="editSave">저장 (PDF 다시 만들기)</button>
          <button type="button" id="editCancel">취소</button>
        </div>
        <div id="editMsg" class="msg"></div>
      </form>
      <div class="preview">
        <div class="cards">
          <div class="card-face" id="editBack"></div>
          <p class="cap">뒷면 미리보기</p>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/nav.js"></script>
<script type="module" src="js/admin.js"></script>
</body>
</html>
